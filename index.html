<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bold POS AI Soporte</title>
  <meta name="description" content="Plataforma oficial de capacitación Bold POS">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/tw.css">
  <link rel="stylesheet" href="css/style.css">
  <script src="vendor/lucide.min.js"></script>
</head>
<body class="bg-[var(--black-0)] text-[var(--black-100)] flex flex-col overflow-hidden" style="height: 100dvh;">

  <!-- Header -->
  <!-- Oculto en móvil: sin logo ni botón "Abrir Bold POS" (el header queda vacío) -->
  <header class="h-14 border-b border-[var(--blue-10)] hidden md:flex items-center justify-between px-4 shrink-0 bg-white z-10">
    <div class="flex items-center gap-2.5">
      <a href="https://bold.co/sistema-pos" target="_blank" rel="noopener noreferrer">
        <img src="assets/Bold%20POS.png" alt="Bold POS" class="h-8 w-auto" />
      </a>
    </div>
    <a href="https://pos.bold.co/" target="_blank" rel="noopener noreferrer"
       class="flex items-center justify-center gap-2 h-10 px-5 rounded-full bg-[var(--background-page)] text-[var(--blue-100)] text-sm font-medium hover:bg-[var(--blue-10)] transition-colors">
      <i data-lucide="external-link" class="w-5 h-5"></i> Abrir Bold POS
    </a>
  </header>

  <!-- Tarjeta para retomar/empezar el recorrido guiado (Task 8): vacía hasta
       que main.js decide qué mostrar según el avance guardado (puede no haber
       nada que mostrar, por eso arranca "hidden"). Fuera de <main> porque no
       es una de las pestañas: es un atajo que conviene ver sin importar cuál
       esté abierta. -->
  <div id="onboarding-resume" class="hidden shrink-0 mx-3 mt-2"></div>

  <!-- Main content -->
  <main class="flex-1 overflow-hidden relative">
    <div id="section-assistant" class="absolute inset-0 section-enter"></div>
    <div id="section-lessons" class="absolute inset-0 section-enter hidden"></div>
    <div id="section-resources" class="absolute inset-0 section-enter hidden"></div>
    <div id="section-course" class="absolute inset-0 section-enter hidden"></div>
  </main>

  <!-- Aviso de descubrimiento del nav (móvil, 1ª vez) -->
  <div id="nav-hint" class="hidden md:hidden mx-3 mb-1 shrink-0 items-center gap-2 px-3 py-2 rounded-xl bg-[var(--blue-100)] text-white text-xs">
    <i data-lucide="arrow-down" class="w-4 h-4 shrink-0"></i>
    <span>Aquí abajo también tienes el <b>Centro de Ayuda</b> y las <b>Preguntas Frecuentes</b>.</span>
    <button class="nav-hint-close ml-auto shrink-0" aria-label="Cerrar aviso"><i data-lucide="x" class="w-4 h-4"></i></button>
  </div>

  <!-- Bottom nav (móvil) -->
  <nav class="h-16 border-t border-[var(--blue-10)] flex items-center justify-around bg-white shrink-0 md:hidden">
    <button data-tab="assistant" class="nav-tab flex flex-col items-center gap-1 text-[10px] font-bold text-[var(--blue-100)]">
      <span class="nav-tab-ico nav-pill-on"><i data-lucide="bot" class="w-5 h-5"></i></span>
      <span>Asistente</span>
    </button>
    <button data-tab="lessons" class="nav-tab flex flex-col items-center gap-1 text-[10px] font-bold text-[var(--black-60)]">
      <span class="nav-tab-ico"><i data-lucide="book-open" class="w-5 h-5"></i></span>
      <span>Centro de Ayuda</span>
    </button>
    <button data-tab="resources" class="nav-tab flex flex-col items-center gap-1 text-[10px] font-bold text-[var(--black-60)]">
      <span class="nav-tab-ico"><i data-lucide="help-circle" class="w-5 h-5"></i></span>
      <span>P. Frecuentes</span>
    </button>
    <!-- Oculta por defecto: se muestra si curso_enabled === 'true' (main.js) -->
    <button data-tab="course" class="nav-tab hidden flex-col items-center gap-1 text-[10px] font-bold text-[var(--black-60)]" style="display:none">
      <span class="nav-tab-ico"><i data-lucide="graduation-cap" class="w-5 h-5"></i></span>
      <span>Curso</span>
    </button>
  </nav>

  <!-- Desktop sidebar -->
  <div class="hidden md:flex md:fixed md:left-0 md:top-14 md:h-[calc(100vh-3.5rem)] md:w-56 md:border-r md:border-[var(--blue-10)] md:bg-white md:flex-col md:p-3 md:gap-1 md:z-10">
    <button data-tab="assistant" class="nav-tab-desk flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-bold text-white bg-[var(--blue-100)]">
      <img src="assets/bolbotlineblue.png" alt="" class="nav-ico-default w-5 h-5 object-contain shrink-0" />
      <img src="assets/bolbotline.png" alt="" class="nav-ico-selected w-5 h-5 object-contain shrink-0" /> bolbot POS
    </button>
    <button data-tab="lessons" class="nav-tab-desk flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-bold text-[var(--blue-100)] hover:bg-[var(--black-10)]">
      <i data-lucide="book-open" class="w-4 h-4"></i> Centro de Ayuda
    </button>
    <button data-tab="resources" class="nav-tab-desk flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-bold text-[var(--blue-100)] hover:bg-[var(--black-10)]">
      <i data-lucide="help-circle" class="w-4 h-4"></i> P. Frecuentes
    </button>
    <!-- Oculta por defecto: se muestra si curso_enabled === 'true' (main.js) -->
    <button data-tab="course" class="nav-tab-desk hidden items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-bold text-[var(--blue-100)] hover:bg-[var(--black-10)]" style="display:none">
      <i data-lucide="graduation-cap" class="w-4 h-4"></i> Curso
    </button>
    <div class="mt-auto pt-3 border-t border-[var(--blue-10)]">
      <a href="https://api.whatsapp.com/send?phone=573171109500&text=Hola%20,%20necesito%20su%20ayuda" target="_blank" rel="noopener noreferrer"
         class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-xs font-bold text-[var(--blue-100)] hover:bg-[var(--black-10)]">
        <i data-lucide="message-circle" class="w-4 h-4"></i> Soporte
      </a>
    </div>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
