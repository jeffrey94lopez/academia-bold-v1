<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin — Bold POS Academy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/tw.css">
  <script src="https://unpkg.com/lucide@0.525.0/dist/umd/lucide.min.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/quill@1.3.7/dist/quill.snow.css">
  <script src="https://cdn.jsdelivr.net/npm/quill@1.3.7/dist/quill.min.js"></script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-[var(--background-page)] text-[var(--black-100)] min-h-screen">

  <!-- Login screen -->
  <div id="loginScreen" class="hidden fixed inset-0 bg-[var(--background-page)] flex items-center justify-center z-50">
    <div class="bg-white rounded-3xl p-8 shadow-xl w-full max-w-sm">
      <img src="assets/Bold%20POS.png" alt="Bold POS" class="h-10 w-auto mx-auto mb-4" />
      <h1 class="text-xl font-black text-center mb-1">Panel Admin</h1>
      <p class="text-[var(--black-60)] text-sm text-center mb-6">Bold POS Academy</p>
      <form id="loginForm" class="space-y-3">
        <input id="loginEmail" type="email" placeholder="Email" required
          class="w-full px-4 py-3 bg-[var(--background-page)] rounded-2xl text-sm outline-none focus:ring-2 focus:ring-[var(--blue-100)]">
        <input id="loginPassword" type="password" placeholder="Contraseña" required
          class="w-full px-4 py-3 bg-[var(--background-page)] rounded-2xl text-sm outline-none focus:ring-2 focus:ring-[var(--blue-100)]">
        <p id="loginError" class="hidden text-red-500 text-xs text-center"></p>
        <button type="submit" class="w-full bg-[var(--blue-100)] text-white py-3 rounded-2xl font-black text-sm hover:scale-[1.02] transition-transform shadow">
          Entrar
        </button>
      </form>
    </div>
  </div>

  <!-- Admin app -->
  <div id="adminApp" class="hidden">
    <header class="bg-white border-b border-[var(--blue-10)] px-6 py-4 flex items-center justify-between sticky top-0 z-10">
      <div class="flex items-center gap-2.5">
        <img src="assets/Bold%20POS.png" alt="Bold POS" class="h-7 w-auto" />
        <span class="text-xs font-bold text-[var(--black-40)] uppercase tracking-wider">Admin</span>
      </div>
      <div class="flex items-center gap-3">
        <a href="index.html" class="text-xs font-bold text-[var(--black-60)] hover:text-[var(--black-100)] flex items-center gap-1">
          <i data-lucide="external-link" class="w-3.5 h-3.5"></i> Ver sitio
        </a>
        <button id="logoutBtn" class="text-xs font-bold text-[var(--black-60)] hover:text-[var(--blue-100)] flex items-center gap-1">
          <i data-lucide="log-out" class="w-3.5 h-3.5"></i> Salir
        </button>
      </div>
    </header>

    <div class="flex">
      <nav class="w-48 bg-white border-r border-[var(--blue-10)] min-h-[calc(100vh-57px)] p-3 space-y-1 shrink-0">
        <button data-panel="lessons" class="admin-nav w-full flex items-center gap-2.5 px-3 py-2.5 rounded-xl text-sm font-bold text-[var(--blue-100)] bg-[var(--blue-10)]">
          <i data-lucide="book-open" class="w-4 h-4"></i> Lecciones
        </button>
        <button data-panel="faq" class="admin-nav w-full flex items-center gap-2.5 px-3 py-2.5 rounded-xl text-sm font-bold text-[var(--black-60)] hover:bg-[var(--black-10)]">
          <i data-lucide="help-circle" class="w-4 h-4"></i> P. Frecuentes
        </button>
        <button data-panel="glossary" class="admin-nav w-full flex items-center gap-2.5 px-3 py-2.5 rounded-xl text-sm font-bold text-[var(--black-60)] hover:bg-[var(--black-10)]">
          <i data-lucide="book" class="w-4 h-4"></i> Glosario
        </button>
        <button data-panel="material" class="admin-nav w-full flex items-center gap-2.5 px-3 py-2.5 rounded-xl text-sm font-bold text-[var(--black-60)] hover:bg-[var(--black-10)]">
          <i data-lucide="paperclip" class="w-4 h-4"></i> Material
        </button>
        <button data-panel="material-apoyo" class="admin-nav w-full flex items-center gap-2.5 px-3 py-2.5 rounded-xl text-sm font-bold text-[var(--black-60)] hover:bg-[var(--black-10)]">
          <i data-lucide="link" class="w-4 h-4"></i> Mat. de apoyo
        </button>
        <button data-panel="suggestions" class="admin-nav w-full flex items-center gap-2.5 px-3 py-2.5 rounded-xl text-sm font-bold text-[var(--black-60)] hover:bg-[var(--black-10)]">
          <i data-lucide="message-square" class="w-4 h-4"></i> Sugerencias Bot
        </button>
        <button data-panel="results" class="admin-nav w-full flex items-center gap-2.5 px-3 py-2.5 rounded-xl text-sm font-bold text-[var(--black-60)] hover:bg-[var(--black-10)]">
          <i data-lucide="bar-chart-2" class="w-4 h-4"></i> Resultados
        </button>
        <button data-panel="analytics" class="admin-nav w-full flex items-center gap-2.5 px-3 py-2.5 rounded-xl text-sm font-bold text-[var(--black-60)] hover:bg-[var(--black-10)]">
          <i data-lucide="trending-up" class="w-4 h-4"></i> Analytics
        </button>
        <button data-panel="activity" class="admin-nav w-full flex items-center gap-2.5 px-3 py-2.5 rounded-xl text-sm font-bold text-[var(--black-60)] hover:bg-[var(--black-10)]">
          <i data-lucide="clock" class="w-4 h-4"></i> Registro
        </button>
        <button data-panel="profile" class="admin-nav w-full flex items-center gap-2.5 px-3 py-2.5 rounded-xl text-sm font-bold text-[var(--black-60)] hover:bg-[var(--black-10)]">
          <i data-lucide="user" class="w-4 h-4"></i> Mi perfil
        </button>
      </nav>

      <main class="flex-1 p-6">
        <div id="panel-lessons"></div>
        <div id="panel-faq" class="hidden"></div>
        <div id="panel-glossary" class="hidden"></div>
        <div id="panel-material" class="hidden"></div>
        <div id="panel-material-apoyo" class="hidden"></div>
        <div id="panel-suggestions" class="hidden"></div>
        <div id="panel-results" class="hidden"></div>
        <div id="panel-analytics" class="hidden"></div>
        <div id="panel-activity" class="hidden"></div>
        <div id="panel-profile" class="hidden"></div>
      </main>
    </div>
  </div>

  <!-- Media library modal -->
  <div id="mediaLibraryModal" class="fixed inset-0 bg-black/60 z-50 hidden items-center justify-center p-4">
    <div class="bg-white rounded-2xl w-full max-w-2xl shadow-2xl flex flex-col" style="max-height:80vh">
      <div class="flex items-center gap-3 p-4 border-b border-[var(--blue-10)]">
        <h3 class="font-bold text-[var(--black-100)] flex-1">Biblioteca de medios</h3>
        <input id="mediaSearch" type="text" placeholder="🔍 Buscar..."
          class="px-3 py-1.5 bg-[var(--background-page)] rounded-lg text-sm outline-none focus:ring-2 focus:ring-[var(--blue-100)]">
        <span id="mediaCount" class="text-xs text-[var(--black-60)]"></span>
      </div>
      <div id="mediaGrid" class="grid grid-cols-4 gap-3 p-4 overflow-y-auto flex-1 min-h-0"></div>
      <div class="flex gap-2 justify-end p-4 border-t border-[var(--blue-10)] shrink-0">
        <button id="mediaCancelBtn" class="px-4 py-2 text-sm text-[var(--black-60)] bg-[var(--background-page)] rounded-lg hover:bg-[var(--black-10)]">Cancelar</button>
        <button id="mediaSelectBtn" class="px-4 py-2 text-sm bg-[var(--blue-100)] text-white rounded-lg disabled:opacity-40 disabled:cursor-not-allowed" disabled>✓ Usar archivo</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.6/Sortable.min.js"></script>
  <script type="module" src="js/admin.js"></script>
</body>
</html>
