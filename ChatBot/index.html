<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bold POS Chat — Soporte Técnico</title>
    <style>
        :root {
            --bold-orange: #FF5A00;
            --bg-dark: #0f0f0f;
            --bg-card: #1a1a1a;
            --bg-input: #252525;
            --text-main: #e0e0e0;
            --text-muted: #888;
            --border-color: #333;
            --user-msg-bg: #FF5A00;
            --bot-msg-bg: #2a2a2a;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        .chat-container {
            width: 100%;
            max-width: 800px;
            height: 90vh;
            background: var(--bg-card);
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 1px solid var(--border-color);
        }

        .header {
            padding: 18px 24px;
            background: #222;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
        }

        .header-title {
            display: flex;
            align-items: center;
            font-weight: 600;
            font-size: 1.1rem;
            color: #fff;
        }

        .status-dot {
            height: 10px; width: 10px;
            background: var(--bold-orange);
            border-radius: 50%;
            margin-right: 10px;
            box-shadow: 0 0 8px var(--bold-orange);
        }

        #new-chat {
            background: transparent;
            border: 1px solid #444;
            color: var(--text-muted);
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 0.9rem;
        }

        #new-chat:hover { background: #333; color: #fff; }

        .messages-area {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .msg {
            max-width: 80%;
            padding: 14px 18px;
            border-radius: 18px;
            line-height: 1.6;
            font-size: 1rem;
            word-wrap: break-word;
        }

        .msg.bot { align-self: flex-start; background: var(--bot-msg-bg); border-bottom-left-radius: 4px; }
        .msg.user { align-self: flex-end; background: var(--user-msg-bg); color: white; border-bottom-right-radius: 4px; }

        .quick-queries {
            display: flex;
            gap: 10px;
            padding: 0 24px 15px;
            flex-wrap: wrap;
        }

        .quick-queries button {
            background: #252525;
            border: 1px solid #444;
            color: var(--text-main);
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.85rem;
        }

        .quick-queries button:hover { background: #333; }

        .input-container {
            padding: 20px 24px;
            background: var(--bg-card);
            border-top: 1px solid var(--border-color);
            display: flex;
            gap: 12px;
        }

        #user-input {
            flex: 1;
            background: var(--bg-input);
            border: 1px solid #444;
            color: white;
            padding: 14px 20px;
            border-radius: 12px;
            font-size: 1rem;
            outline: none;
        }

        #send-btn {
            background: var(--bold-orange);
            border: none;
            color: white;
            width: 48px;
            height: 48px;
            border-radius: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .typing-indicator {
            font-size: 0.85rem;
            color: var(--text-muted);
            padding: 0 24px 10px;
            display: none;
        }
        .resolution-btns {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 6px 0 0 4px;
            flex-wrap: wrap;
        }

        .resolution-label {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .res-btn {
            background: #252525;
            border: 1px solid #555;
            color: var(--text-main);
            padding: 5px 14px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.8rem;
            transition: background 0.15s;
        }

        .res-yes:hover { background: #1a3a1a; border-color: #4a9a4a; color: #7dd87d; }
        .res-no:hover  { background: #3a1a1a; border-color: #9a4a4a; color: #d87d7d; }

        /* Media blocks */
        .chat-media { display: flex; flex-direction: column; gap: 10px; max-width: 80%; align-self: flex-start; }
        .chat-img-wrap img {
            width: 100%; border-radius: 10px; display: block; cursor: zoom-in;
            border: 1px solid #333; transition: opacity 0.15s;
        }
        .chat-img-wrap img:hover { opacity: 0.9; }
        .chat-video-wrap { border-radius: 10px; overflow: hidden; border: 1px solid #333; }
        .chat-video-wrap iframe { width: 100%; aspect-ratio: 16/9; border: none; display: block; }
        .chat-media-caption { font-size: 11px; color: var(--text-muted); margin: 4px 0 0; }

        /* Lightbox */
        #bodi-lightbox {
            display: none; position: fixed; inset: 0; z-index: 9999;
            align-items: center; justify-content: center;
        }
        #bodi-lb-backdrop {
            position: absolute; inset: 0; background: rgba(0,0,0,0.85); cursor: pointer;
        }
        #bodi-lb-content {
            position: relative; z-index: 1; max-width: 90vw; max-height: 90vh;
            display: flex; flex-direction: column; align-items: center; gap: 12px;
        }
        #bodi-lb-img {
            max-width: 90vw; max-height: 75vh; border-radius: 10px;
            object-fit: contain; box-shadow: 0 8px 40px rgba(0,0,0,0.7);
        }
        #bodi-lb-caption { color: #ccc; font-size: 13px; text-align: center; }
        #bodi-lb-actions { display: flex; gap: 10px; }
        #bodi-lb-actions button {
            background: #2a2a2a; border: 1px solid #555; color: #e0e0e0;
            padding: 8px 18px; border-radius: 8px; cursor: pointer; font-size: 13px;
            transition: background 0.15s;
        }
        #bodi-lb-download:hover { background: #1a4a1a; border-color: #4a9a4a; color: #7dd87d; }
        #bodi-lb-close:hover    { background: #3a1a1a; border-color: #9a4a4a; color: #d87d7d; }
    </style>
</head>
<body>

    <div class="chat-container">
        <div class="header">
            <div class="header-title">
                <span class="status-dot"></span>
                Asistente Bold POS
            </div>
            <button id="new-chat">Nueva conversación</button>
        </div>
        
        <div id="chat-box" class="messages-area">
            <div class="msg bot">¡Hola Jeffrey! Soy el experto en Bold POS. ¿Qué duda técnica tienes hoy?</div>
        </div>

        <div id="typing" class="typing-indicator">Escribiendo...</div>

        <div class="quick-queries">
            <button onclick="quickQuery('¿Cómo cerrar caja?')">Cierre de caja</button>
            <button onclick="quickQuery('Configurar impresora')">Impresora</button>
        </div>

        <div class="input-container">
            <input type="text" id="user-input" placeholder="Escribe tu mensaje..." autocomplete="off">
            <button id="send-btn">➤</button>
        </div>
    </div>

    <script src="chat.js"></script>
</body>
</html>
